[package]
name = "bayoen-wars-builder"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
delharc = { version = "0.8", default-features = false, features = ["std"] }
encoding_rs = "0.8"
expected-write = { git = "https://github.com/mcpads/retro-typed-isa.git", rev = "9b31c628465cb83a633445de7d39e985be184cb7" }
fatfs = { version = "0.3.6", default-features = false, features = ["alloc", "std"] }
fontdue = "=0.9.3"
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.23"
v30 = { git = "https://github.com/mcpads/retro-typed-isa.git", rev = "9b31c628465cb83a633445de7d39e985be184cb7" }

[profile.release]
lto = "thin"
strip = true
